name: Validate SonoMarzi Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify source structure and syntax
        run: bash scripts/verify-source.sh

      - name: Install isolated Civil integration test dependencies
        run: npm ci --prefix tests/civil-support --ignore-scripts --no-audit --no-fund

      - name: Install API dependencies for official return template checks
        run: npm ci --prefix lambdas/api --ignore-scripts --no-audit --no-fund

      - name: Verify California PostgreSQL and staff forms
        run: |
          node tests/civil-admin-settings.test.mjs
          node tests/civil-california-postgres.test.mjs
          node tests/civil-california-view.test.mjs
          node tests/civil-california-presentation.test.mjs
          mkdir -p artifacts/civil-pdf
          CIVIL_PDF_QA_DIR=artifacts/civil-pdf node tests/civil-california-returns.test.mjs

      - name: Preserve example unsigned Judicial Council form drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civil-official-form-pdf-previews
          path: artifacts/civil-pdf/*.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Chromium UI smoke test tools
        run: |
          npm install --prefix tests/civil-support --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          tests/civil-support/node_modules/.bin/playwright install chromium

      - name: Verify Civil case workspace in a real browser
        run: |
          mkdir -p artifacts
          node tests/civil-california-browser.test.mjs

      - name: Preserve Civil desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civil-ui-browser-screenshots
          path: artifacts/civil-*.png
          if-no-files-found: ignore
          retention-days: 7
